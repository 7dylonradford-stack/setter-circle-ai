<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b07"><title>Professional Training Portfolio | The Setter Circle</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#f1f5e9;background:#080b07}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse 70% 50% at 90% 0,rgba(208,248,59,.12),transparent),#080b07}
main{max-width:850px;margin:auto;padding:25px clamp(17px,5vw,42px) 90px}.nav{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #35472c;padding-bottom:24px;margin-bottom:54px}
.brand{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:850;letter-spacing:.04em}.brand img{width:42px;height:42px;border:1px solid #687d31;border-radius:50%}.brand span{color:#d0f83b}
a{color:#d0f83b;text-decoration:none;font-size:12px}h1{font-size:clamp(37px,6vw,69px);letter-spacing:-.062em;line-height:1.05;margin:13px 0}
h2{font-size:23px;letter-spacing:-.04em}.ey{font-size:10px;color:#d0f83b;font-weight:800;letter-spacing:.16em}
p{font-size:15px;line-height:1.75;color:#afbea5}.hero{border-bottom:1px solid #435831;padding-bottom:35px}
.card{background:linear-gradient(135deg,#1c2917,#0c160c);border:1px solid #465b35;border-radius:17px;padding:24px;margin:18px 0}
.card strong{font-size:18px}.card small{display:block;color:#c5db8d;font-size:10px;letter-spacing:.12em;margin-bottom:10px}
.status{border:1px solid #5d723d;background:#1d3013;border-radius:999px;color:#d8ef98;display:inline-block;padding:8px 12px;font-size:10px;font-weight:800}
footer{padding:30px 0;border-top:1px solid #33462e;color:#83937b;font-size:12px}
</style><link rel="stylesheet" href="/cinematic-platform-v19.css?v=19">
</head><body>
<main><header class="nav"><div class="brand"><img src="/setter-logo.svg" alt=""><span>THE SETTER CIRCLE</span></div><a href="/">Back to website ↗</a></header>
<div id="profile" role="status" aria-live="polite"><p>Loading student training portfolio…</p></div>
<footer>This is a student-selected learning portfolio. Self-described practice work must not be interpreted as independent accreditation, verified employment or guaranteed earnings.</footer>
</main>
<script>
const escapeText=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
(async()=>{
 const token=new URLSearchParams(location.search).get("token")||"",box=document.getElementById("profile");
 if(!/^[0-9a-f-]{36}$/i.test(token)){box.textContent="This portfolio link is invalid.";return}
 try{
  const r=await fetch("/api/advanced/portfolio/share/"+encodeURIComponent(token),{cache:"no-store"}),d=await r.json();
  if(!r.ok)throw Error("This portfolio is no longer public.");
  const p=d.portfolio||{},examples=Array.isArray(p.selected_evidence)?p.selected_evidence:[];
  box.innerHTML='<section class="hero"><span class="ey">STUDENT / TRAINING PORTFOLIO</span><h1>'+escapeText(p.name||"Setter Circle Student")+'</h1><p>'+escapeText(p.headline||"Appointment setting trainee")+'</p><span class="status">Student-selected evidence</span></section>'+
    '<section><h2>About my training</h2><p>'+escapeText(p.introduction||"No introduction supplied")+'</p></section>'+
    '<section><h2>Practice examples</h2>'+(examples.length?examples.map(x=>'<div class="card"><small>PRACTICE · SELF-REPORTED</small><strong>'+escapeText(x.title)+'</strong><p>'+escapeText(x.description)+'</p></div>').join(""):'<p>No examples shared.</p>')+'</section>';
 }catch(e){box.innerHTML='<h1>Portfolio unavailable</h1><p>'+escapeText(e.message)+'</p>'}
})();
</script></body></html>
